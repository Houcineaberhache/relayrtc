global:
  scrape_interval: 2s
  evaluation_interval: 2s
  scrape_timeout: 2s

rule_files:
  - /etc/prometheus/relayrtc.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: coturn
    metrics_path: /metrics
    static_configs:
      - targets:
          - coturn:9641
