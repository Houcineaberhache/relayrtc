name: Bug report
description: Report a reproducible problem in RelayRTC
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Before reporting a security issue, read SECURITY.md and use private vulnerability reporting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the observed problem and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal reproduction or exact steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: RelayRTC version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, runtime, browser, and deployment details that matter.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials, tokens, and personal data before sharing logs.
